name: COMPANY Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: company-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check app files
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f supabase-config.js
          test -f manifest.webmanifest
          test -f sw.js
          echo "COMPANY app files are present."

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
